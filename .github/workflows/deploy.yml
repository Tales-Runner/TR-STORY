name: Deploy to GitHub Pages

on:
  # 일 1회 자동 빌드 — 02:00 UTC (KST 11:00)
  schedule:
    - cron: "0 2 * * *"
  # 코드 push 시 즉시 빌드
  push:
    branches: [main]
  # 수동 trigger ("Run workflow" 버튼)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포는 한 번에 하나만; 진행 중인 배포는 cancel 안 하고 큐잉.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Fetch stories from upstream
        run: npm run fetch-data

      - name: Build (static export)
        env:
          NEXT_PUBLIC_BASE_PATH: /TR-STORY
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
