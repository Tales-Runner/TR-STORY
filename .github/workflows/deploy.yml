name: Deploy to GitHub Pages

on:
  # 코드 push 시 즉시 빌드
  push:
    branches: [main]
  # 수동 trigger ("Run workflow" 버튼) — 데이터 새로고침 시도용
  workflow_dispatch:
  # 예약 실행 없음. 2026-09-09 실행에서 Origin 제거 후에도 CI 403 확인.
  # IP 차단 여부는 응답 본문을 포함한 재진단 필요. 로컬 갱신은:
  #   npm run fetch-data && git commit -am "data: refresh" && git push

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포는 한 번에 하나만; 진행 중인 배포는 cancel 안 하고 큐잉.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Try to refresh stories from upstream
        id: refresh
        timeout-minutes: 10
        # 코드 push 는 기존 스냅샷으로 배포할 수 있지만 수동 갱신은 실패를 숨기지 않는다.
        run: npm run fetch-data
        continue-on-error: ${{ github.event_name == 'push' }}

      - name: Report data freshness
        if: ${{ !cancelled() && steps.refresh.outcome != 'skipped' }}
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          if [ "$REFRESH_OUTCOME" != "success" ]; then
            echo "::warning::Upstream refresh failed. The committed snapshot and its verification timestamp are unchanged. See the refresh step for the HTTP response."
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const meta = JSON.parse(readFileSync('src/data/data-meta.json', 'utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### Story data\n\nRefresh: **${process.env.REFRESH_OUTCOME}**\n\n` +
            `Last fully verified: ${meta.updatedAt}\n\n` +
            `Stories: ${meta.totalCount}; latest release: ${meta.latestOpenDt}\n`);
          NODE

      - name: Build (static export)
        env:
          NEXT_PUBLIC_BASE_PATH: /TR-STORY
          NEXT_PUBLIC_SITE_URL: https://tales-runner.github.io/TR-STORY
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
