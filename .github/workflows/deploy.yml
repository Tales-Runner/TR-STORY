name: Deploy to GitHub Pages

on:
  # 코드 push 시 즉시 빌드
  push:
    branches: [main]
  # 수동 trigger ("Run workflow" 버튼) — 데이터 새로고침 시도용
  workflow_dispatch:
  # NOTE: 일 1회 cron 은 의도적으로 비활성. tr.rhaon.co.kr 가 GitHub
  # runner IP 를 차단하기 때문에 CI 에서 데이터 갱신이 불가능하고,
  # 따라서 cron 으로 변화 없는 stories.json 을 매일 재배포할 가치 없음.
  # 새 회차 반영은 로컬에서:
  #   npm run fetch-data && git commit -am "data: refresh" && git push

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포는 한 번에 하나만; 진행 중인 배포는 cancel 안 하고 큐잉.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Try to refresh stories from upstream
        # tr.rhaon.co.kr 가 GitHub-hosted runner IP 대역을 403 으로 막기
        # 때문에, 페치는 best-effort 로만 시도하고 실패 시 커밋된
        # src/data/stories.json snapshot 으로 빌드한다.
        # 데이터 갱신은 로컬에서 `npm run fetch-data && git push` 흐름.
        run: npm run fetch-data || echo "::warning::fetch-data failed; building with committed snapshot"
        continue-on-error: true

      - name: Build (static export)
        env:
          NEXT_PUBLIC_BASE_PATH: /TR-STORY
          NEXT_PUBLIC_SITE_URL: https://tales-runner.github.io/TR-STORY
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
